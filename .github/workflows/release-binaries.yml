name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag (defaults to current Cargo.toml version)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (Linux x86_64 + macOS ARM64 + i1.is)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Linux + macOS (ssh s) and publish to GitHub & i1.is
        run: |
          ./scripts/release.sh --publish
