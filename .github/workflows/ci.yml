name: Smart Tree CI

on:
  push:
    branches: [main, develop, "aye/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libsqlite3-dev \
            clang \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavdevice-dev \
            libavfilter-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --features full -- -D warnings

      - name: Build library
        run: cargo build --lib --features full

      - name: Build binaries
        run: cargo build --bins --features full

      - name: Run library tests
        run: cargo test --lib --features full

      - name: Run integration tests
        run: |
          cargo test --test mcp_integration --features full
          cargo test --test latent_moe_simd_test --features full
          cargo test --test latent_moe_layer_test --features full
          cargo test --test hybrid_attention_test --features full
          cargo test --test galaxia_kintsugi_e2e_test --features full
          cargo test --test vaked_foken_e2e_test --features full

      - name: Run benchmarks
        run: cargo bench --no-run --features full

  test-macos:
    name: macOS Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --features full -- -D warnings

      - name: Build and test
        run: |
          cargo build --lib --features full
          cargo test --lib --features full
          cargo test --test mcp_integration --features full
          cargo test --test vaked_foken_e2e_test --features full

  test-windows:
    name: Windows Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --features full -- -D warnings

      - name: Build and test
        run: |
          cargo build --lib --features full
          cargo test --lib --features full

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libsqlite3-dev \
            clang

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --no-run --features full

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libsqlite3-dev \
            clang

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Smart Tree supply-chain security scan
        run: cargo run --bin st -- --security-scan .

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libsqlite3-dev \
            clang

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate docs
        run: cargo doc --features full --no-deps

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, test-macos, test-windows, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libsqlite3-dev \
            clang

      - name: Build release binaries
        run: cargo build --release --bins --features full

      - name: Create release archives
        run: |
          mkdir -p release
          for bin in st std st-hub n8x m8 import-claude-memories; do
            if [ -f target/release/$bin ]; then
              cp target/release/$bin release/
            fi
          done
          cd release
          tar -czf smart-tree-${{ github.ref_name }}-linux-x86_64.tar.gz *
          sha256sum smart-tree-${{ github.ref_name }}-linux-x86_64.tar.gz > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/smart-tree-${{ github.ref_name }}-linux-x86_64.tar.gz
            release/sha256sums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
