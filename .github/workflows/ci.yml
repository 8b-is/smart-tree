name: CI

on:
  push:
    branches: [main, "aye/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runs_on: [self-hosted, Linux, X64]
          - name: macos-arm64
            runs_on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version

      - name: Formatting
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cargo fmt --all -- --check

      - name: Lints
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cargo clippy --workspace -- -D warnings

      - name: Tests
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cargo test --workspace -- --test-threads=1

      - name: MCP Combinatorics & LLM Integration (macOS Metal + MLX FFI)
        if: runner.os == 'macOS'
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cargo test --test mcp_integration --features "metal,mlx-ffi" -- --nocapture
          cargo bench --bench combinatorics_llm_bench --features "metal,mlx-ffi" --no-run
